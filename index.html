<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rubixion | Projects</title>
  <meta name="description" content="Projects by Rubixion: OllieML, a celebrity lookalike finder; Shaula, a 3D star map; MindPortal, a focus extension for Chrome; and a molecular geometry calculator.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <style>
    /* tokens lifted from ollie-frontend/app/globals.css */
    :root {
      --bg: oklch(0.08 0 0);
      --card: oklch(0.11 0 0);
      --border: oklch(1 0 0 / 8%);
      --cyan: rgb(100, 130, 210);
      --glow: rgb(100 130 210 / 15%);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; background: var(--bg); color: #fff;
      font-family: 'Outfit', system-ui, sans-serif;
      background-image: radial-gradient(rgb(255 255 255 / 0.07) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    main { max-width: 1000px; margin: 0 auto; padding: 96px 16px 64px; }
    .eyebrow { color: var(--cyan); font-size: 11px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
    h1 { font-size: clamp(40px, 7vw, 64px); font-weight: 900; letter-spacing: -0.03em; margin: 12px 0 8px; }
    .lead { color: rgb(255 255 255 / 0.45); max-width: 520px; line-height: 1.6; margin-bottom: 48px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      text-align: left; font: inherit; color: inherit; cursor: pointer;
      display: flex; flex-direction: column; gap: 10px; padding: 24px;
      background: rgb(255 255 255 / 0.025); border: 1px solid var(--border); border-radius: 16px;
      transition: border-color .2s, background .2s, transform .2s;
    }
    .card:hover { border-color: rgb(255 255 255 / 0.18); background: rgb(255 255 255 / 0.04); transform: translateY(-2px); }
    .card:focus-visible, .btn:focus-visible, .close:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .card .tag { color: rgb(255 255 255 / 0.25); font-size: 12px; font-weight: 500; }
    .card h2 { font-size: 20px; font-weight: 900; letter-spacing: -0.02em; }
    .card p { color: rgb(255 255 255 / 0.45); font-size: 13px; line-height: 1.6; flex: 1; }
    .stack { color: var(--cyan); font-size: 12px; font-weight: 500; }
    dialog .stack { margin-top: 16px; }
    .card .more { color: rgb(255 255 255 / 0.3); font-size: 12px; font-weight: 600; }
    .card:hover .more { color: rgb(255 255 255 / 0.65); }

    dialog {
      margin: auto; width: min(560px, calc(100% - 32px)); padding: 32px;
      background: var(--card); color: #fff; border: 1px solid var(--border); border-radius: 20px;
      box-shadow: 0 0 80px var(--glow);
    }
    dialog::backdrop { background: rgb(0 0 0 / 0.7); backdrop-filter: blur(4px); }
    dialog h2 { font-size: 28px; font-weight: 900; letter-spacing: -0.02em; margin: 6px 0 16px; }
    dialog .body { color: rgb(255 255 255 / 0.6); line-height: 1.7; font-size: 15px; }
    dialog .body p + p { margin-top: 12px; }
    .actions { display: flex; gap: 12px; align-items: center; margin-top: 28px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 22px; border-radius: 999px;
      background: var(--cyan); color: #000; font-weight: 700; font-size: 14px; text-decoration: none;
      transition: filter .2s;
    }
    .btn:hover { filter: brightness(1.15); }
    .url { color: rgb(255 255 255 / 0.3); font-size: 13px; }
    .close {
      position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 10px;
      background: rgb(255 255 255 / 0.05); border: 1px solid var(--border); color: rgb(255 255 255 / 0.6);
      font-size: 18px; cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Portfolio</p>
    <h1>Projects</h1>
    <p class="lead">A few things I've built. There's a face recognition model that finds your celebrity lookalike, a 3D map of the night sky, a focus extension for Chrome and a molecule viewer for chemistry homework.</p>
    <div class="grid" id="grid"></div>
  </main>

  <dialog id="modal">
    <button class="close" aria-label="Close" onclick="modal.close()">×</button>
    <p class="eyebrow" id="m-tag"></p>
    <h2 id="m-name"></h2>
    <div class="body" id="m-body"></div>
    <p class="stack" id="m-stack"></p>
    <div class="actions">
      <a class="btn" id="m-link" target="_blank" rel="noopener">Try it out ↗</a>
      <span class="url" id="m-url"></span>
    </div>
  </dialog>

  <script>
    // ponytail: data inline; add a project by adding an object
    // ponytail: ordered best first
    const projects = [
      {
        name: "OllieML",
        tag: "Machine learning",
        short: "Upload a photo and find your five closest celebrity lookalikes, ranked by how similar your faces are.",
        full: [
          "Ollie turns a face into a 512-number fingerprint using a SphereFaceNet model I trained with CosFace loss. It compares that fingerprint against more than 40,000 photos of over 5,000 celebrities from Wikimedia Commons and returns the closest matches.",
          "The site also has a face symmetry test, a tool for comparing two faces and an AI stylist. Its tools can be used from Claude and ChatGPT through MCP and app integrations."
        ],
        stack: "Custom face model, Next.js, Cloudflare",
        url: "https://www.ollieml.com/",
        label: "ollieml.com"
      },
      {
        name: "ShaulaOS",
        tag: "Operating system",
        short: "An x86-64 operating system written from scratch that runs real Minecraft and Firefox.",
        full: [
          "ShaulaOS has its own boot loaders, kernel, drivers, window system, file system, network stack with TLS 1.3, C library and native apps. It boots from BIOS or UEFI into a desktop with overlapping windows, a taskbar and a searchable start menu.",
          "A Linux compatibility layer in the kernel runs unmodified programs from Alpine Linux, including Minecraft: Java Edition, Firefox, Python and a shell. A separate layer runs 32-bit Windows programs, and DOOM runs natively with sound.",
          "It also has its own programming language, also called Shaula, with a REPL and a code editor that runs it."
        ],
        stack: "C, x86-64 assembly, QEMU",
        label: "Source on request"
      },
      {
        name: "Antares",
        tag: "3D star map",
        short: "Fly through all 88 constellations and into the real planetary systems around nearby stars.",
        full: [
          "Antares is an interactive 3D sky that runs in the browser. It shows every star you can see with the naked eye, along with constellation figures, IAU boundaries and the Milky Way. Click a star to see its details, then click again to fly into its system.",
          "Each system is built from the NASA Exoplanet Archive, using real orbital elements wherever they are known. Binary and multiple stars use measured orbits from published catalogs, and the Solar System uses positions from JPL Horizons.",
          "You can search for a constellation (Orion), a star (Betelgeuse), a planet host (TRAPPIST-1) or a single planet (Kepler-22 b)."
        ],
        stack: "Three.js (WebGPU), Python, NumPy",
        url: "https://rubixion.github.io/antares/",
        label: "rubixion.github.io/antares"
      },
      {
        name: "MindPortal",
        tag: "Chrome extension",
        short: "A focus companion for Chrome that tracks your time, nudges you off distracting sites and keeps notes, lists and habits a shortcut away.",
        full: [
          "MindPortal adds a floating owl to every page. It shows a Pomodoro timer and live counts of your focused and distracted time, and it opens a panel with tabs for notes, lists, a calendar, habits and saved pages.",
          "It sorts sites into productive and distracting, and it can warn you, pause you for a few seconds or fully block a site during focus mode. Daily goals, streaks and XP reward progress instead of punishing slip-ups.",
          "Everything is stored locally in your browser, and nothing is sent to a server."
        ],
        stack: "TypeScript, React, Chrome MV3",
        url: "https://github.com/Rubixion/mindportal",
        label: "github.com/Rubixion/mindportal"
      },
      {
        name: "Molecular Geometry Calculator",
        tag: "Chemistry",
        short: "Type a molecule's name or formula and explore its real 3D structure, VSEPR shape and bond angles.",
        full: [
          "This started as a C++ console app that parsed chemical formulas and printed VSEPR shapes and bond angles. I rebuilt it as a web app that pulls real structure data from PubChem and renders the molecule in 3D.",
          "Search by name (caffeine, aspirin) or by formula (H₂O, Na₂SO₄). Each compound gets a summary of its geometry, bond angle, molar mass, polarity and intermolecular forces. Click any atom to see its electronegativity, hybridization, lone pairs and formal charge.",
          "Ionic compounds that PubChem doesn't have, like Na₂SO₄, are built from the formula unit instead."
        ],
        stack: "Three.js (WebGPU), PubChem API, C++",
        url: "https://rubixion.github.io/molecular-geometry-calculator/",
        label: "rubixion.github.io/molecular-geometry-calculator"
      }
    ];

    const grid = document.getElementById("grid");
    const modal = document.getElementById("modal");
    const $ = id => document.getElementById(id);

    projects.forEach(p => {
      const card = document.createElement("button");
      card.className = "card";
      card.innerHTML = `<span class="tag"></span><h2></h2><p></p><span class="stack"></span><span class="more">Details →</span>`;
      card.querySelector(".tag").textContent = p.tag;
      card.querySelector("h2").textContent = p.name;
      card.querySelector("p").textContent = p.short;
      card.querySelector(".stack").textContent = p.stack;
      card.onclick = () => {
        $("m-tag").textContent = p.tag;
        $("m-name").textContent = p.name;
        $("m-body").replaceChildren(...p.full.map(t => Object.assign(document.createElement("p"), { textContent: t })));
        $("m-stack").textContent = "Built with " + p.stack;
        $("m-link").href = p.url || "";
        $("m-link").style.display = p.url ? "" : "none";
        $("m-url").textContent = p.label;
        modal.showModal();
      };
      grid.append(card);
    });

    // click on backdrop closes
    modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
  </script>
</body>
</html>
